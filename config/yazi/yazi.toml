#"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "mtime"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 2
max_width = 600
max_height = 900
cache_dir = "~/.cache/yazi"
image_delay = 30
image_filter = "triangle"
image_quality = 90
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:-nvim} %s', desc = "$EDITOR", for = "unix", block = true },
]
open_browser = [
  { run = '${BROWSER:-zen-browser} %s', orphan = true, desc = "Zen", for = "linux" },
]
open_firefox = [{ run = 'firefox %s', orphan = true, desc = "Firefox", for = "linux" }]
open_draw = [
  { run = 'libreoffice --draw %s', orphan = true, desc = "LibreOffice Draw", for = "linux" },
]
office = [
  { run = 'libreoffice %s', orphan = true, desc = "LibreOffice", for = "linux" },
]
play = [{ run = 'mpv %s', orphan = true, desc = "mpv", for = "unix" }]
reveal = [{ run = 'nautilus %d1', orphan = true, desc = "Nautilus", for = "linux" }]
open_dir = [{ run = 'nautilus %s1', orphan = true, desc = "Nautilus", for = "linux" }]
open =[{ run = 'xdg-open %s1', orphan = true, desc = "xdg-open", for = "linux" }]
extract = [{ run = 'ya pub extract --list %s', desc = "Extract here" }]
extract_7z = [{ run = '7z x %s1', block = true, desc = "7z x", for = "unix" }]
compress_zip = [
  { run = '~/.config/yazi/helpers/compress-zip.sh %s', desc = "Compress to .zip", for = "unix" },
]
compress_tar = [
  { run = '~/.config/yazi/helpers/compress-tar.sh %s', desc = "Compress to .tar.gz", for = "unix" },
]

[open]
rules = [
  # Folder
  { url = "*/", use = ["edit", "open_dir", "compress_zip", "compress_tar"] },
  # HTML
  { mime = "text/html", use = ["open_browser", "edit"] },
  # Text
  { mime = "text/*", use = ["edit", "open_browser"] },
  # Image
  { mime = "image/*", use = ["open_browser", "open_firefox"] },
  # Media
  { mime = "{audio,video}/*", use = ["play"] },
  # PDF
  { mime = "application/pdf", use = ["open_browser", "open_draw"] },
  # Office by extension: some OOXML files sniff as application/zip
  { url = "*.{docx,xlsx,pptx,odt,ods,odp}", use = ["office"] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "extract_7z"] },
  # Office
  { mime = "application/vnd.oasis.opendocument.*", use = ["office"] },
  { mime = "application/vnd.openxmlformats-officedocument.*", use = ["office"] },
  { mime = "application/msword", use = ["office"] },
  { mime = "application/{vnd.ms-excel,vnd.ms-powerpoint}", use = ["office"] },
  # JSON
  { mime = "application/{json,ndjson}", use = ["edit", "open_browser"] },
  { mime = "*/javascript", use = ["edit", "open_browser"] },
  { mime = "application/{xml,toml,yaml,x-yaml,sql,x-shellscript}", use = ["edit"] },
  # Empty file
  { mime = "inode/empty", use = ["edit"] },
  # Virtual file system
  { mime = "vfs/{absent,stale}", use = ["open_browser"] },
  # Fallback
  { url = "*", use = ["open", "reveal", "compress_zip", "compress_tar"] },
]

[tasks]
micro_workers = 5
macro_workers = 5
bizarre_retry = 3
image_alloc = 536870912
image_bound = [10000, 10000]
suppress_preload = false

[plugin]
fetchers = [
  # Mimetype
  { id = "mime", url = "*/", run = "mime.dir", prio = "high", group = "directory" },
  { id = "mime", url = "local://*", run = "mime.local", prio = "high", group = "file" },
  { id = "mime", url = "remote://*", run = "mime.remote", prio = "high", group = "file" },
]
spotters = [
  { url = "*/", run = "folder" },
  # Code
  { mime = "text/*", run = "code" },
  { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
  # Image
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # Virtual file system
  { mime = "vfs/*", run = "vfs" },
  # Error
  { mime = "null/*", run = "null" },
  # Fallback
  { url = "*", run = "file" },
]
preloaders = [
  # Image
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/ms-opentype", run = "font" },
]
previewers = [
  { url = "*/", run = "folder" },
  # Code
  { mime = "text/*", run = "code" },
  { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
  # JSON — handled by code previewer via text fallback
  { mime = "application/{json,ndjson}", run = "code" },
  # Image
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
  { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
  { url = "*.{AppImage,appimage}", run = "archive" },
  # Virtual Disk / Disk Image
  { mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
  { mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
  { url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/ms-opentype", run = "font" },
  # Empty file
  { mime = "inode/empty", run = "empty" },
  # Virtual file system
  { mime = "vfs/*", run = "vfs" },
  # Error
  { mime = "null/*", run = "null" },
  # Fallback
  { url = "*", run = "file" },
]

[input]
cursor_blink = false

# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# filter
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
# trash
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

# delete
delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

# overwrite
overwrite_title = "Overwrite file?"
overwrite_body = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

# quit
quit_title = "Quit?"
quit_body = "The following tasks are still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
sort_translit = false
