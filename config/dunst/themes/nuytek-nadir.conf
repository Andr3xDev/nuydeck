[global]
    format = "<b>%s %p</b>\n%b"
    sort = yes
    indicate_hidden = true
    idle_threshold = 0
    width = 300
    alignment = center
    show_age_threshold = 40
    sticky_history = yes
    word_wrap = yes
    separator_height = 2
    horizontal_padding = 10
    follow = mouse
    frame_width = 3
    corner_radius = 8
    offset = (20,20)
    separator_color = "#323232"

[urgency_low]
    background = "#151515"
    foreground = "#E9EDEB"
    frame_color = "#323232"
    timeout = 7
    format = "<b><span color='#ECEC8D'>%s</span></b>\n%b"

[urgency_normal]
    background = "#151515"
    foreground = "#E9EDEB"
    frame_color = "#323232"
    timeout = 7
    format = "<b><span color='#5AE2DD'>%s</span></b>\n%b"

[urgency_critical]
    background = "#151515"
    foreground = "#E9EDEB"
    frame_color = "#EF616D"
    highlight = "#EF616D"
    timeout = 10
    format = "<b><span color='#EF616D'>%s</span></b>\n%b"
