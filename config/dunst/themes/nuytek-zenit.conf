[global]
    format = "<b>%s %p</b>\n%b"
    sort = yes
    indicate_hidden = true
    idle_threshold = 0
    width = 300
    alignment = center
    show_age_threshold = 40
    sticky_history = yes
    word_wrap = yes
    separator_height = 2
    horizontal_padding = 10
    follow = mouse
    frame_width = 3
    corner_radius = 8
    offset = (20,20)
    separator_color = "#DADCDC"

[urgency_low]
    background = "#F3F4F4"
    foreground = "#16211E"
    frame_color = "#DADCDC"
    timeout = 7
    format = "<b><span color='#8A7C12'>%s</span></b>\n%b"

[urgency_normal]
    background = "#F3F4F4"
    foreground = "#16211E"
    frame_color = "#DADCDC"
    timeout = 7
    format = "<b><span color='#0B726D'>%s</span></b>\n%b"

[urgency_critical]
    background = "#F3F4F4"
    foreground = "#16211E"
    frame_color = "#C23B46"
    highlight = "#C23B46"
    timeout = 10
    format = "<b><span color='#C23B46'>%s</span></b>\n%b"
