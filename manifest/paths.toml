pattern = "quickshell/lucyna/legacy/monitors/data/identities.json"

[[exclude]]
root = "config"
pattern = "systemd/user/*.wants/"

[[exclude]]
root = "config"
pattern = "nuydeck/logs/"

[[exclude]]
root = "config"
pattern = "nuydeck/theme/"

[[exclude]]
root = "config"
pattern = "nvim/lazy-lock.json"
